name: release

# On a version tag (e.g. v0.1.0), build DeadAir for Linux/macOS/Windows and
# attach the binaries to the GitHub Release. Publishing to crates.io is done
# manually (`cargo publish`) with a crates.io token.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: deadair-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: deadair-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: deadair-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/deadair"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.name }}"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
