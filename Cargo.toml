[package]
name = "deadair"
version = "0.2.0"
edition = "2021"
description = "Fast noise-weighted Active Directory attack-path solver - the native engine core for NoiseHound"
license = "MIT"
authors = ["Velkris"]
readme = "README.md"
repository = "https://github.com/warpedatom/DeadAir"
homepage = "https://github.com/warpedatom/DeadAir"
keywords = ["bloodhound", "active-directory", "pathfinding", "opsec", "detection"]
categories = ["command-line-utilities"]

[[bin]]
name = "deadair"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pathfinding = "4"

[profile.release]
lto = true
codegen-units = 1
